[project]
name = "theurbanworld-pipeline"
version = "0.1.0"
description = "GHSL urban data processing pipeline for The Urban World (theurban.world)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Core geospatial
    "rioxarray>=0.17.0",
    "xarray>=2024.1.0",
    "rasterio>=1.3.10",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    # H3 processing
    "h3>=4.0.0",
    "h3ronpy>=0.21.0",
    # Data processing
    "polars>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    # Database
    "duckdb>=1.1.0",
    # Distributed computing
    "dask[complete]>=2024.1.0",
    # Utilities
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Country/continent mapping
    "pycountry>=24.6.0",
    "pycountry-convert>=0.7.2",
    # Cloud storage (R2 upload)
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
    # Data exploration
    "streamlit>=1.40.0",
    "modal>=1.2.4",
    "psycopg2-binary>=2.9.11",
    # Data validation
    "pandera[io]>=0.21.0",
    "ibis-framework[duckdb]>=9.0.0",
    "fonttools>=4.61.1",
    "rapidfuzz>=3.14.3",
    "sparqlwrapper>=2.0.0",
]

[project.scripts]
# Download domain
download-ghsl = "src.download.download_ghsl:main"
download-h3 = "src.download.download_h3_r8:main"

# Cities domain
extract-attributes = "src.cities.extract_attributes:cli"
extract-geometries = "src.cities.extract_geometries:main"
generate-cities = "src.cities.generate_cities:main"
compute-populations = "src.cities.compute_populations:main"
compute-rankings = "src.cities.compute_rankings:main"

# Grid domain
extract-grid = "src.grid.extract_grid_1km:main"

# H3 domain
load-h3-psql = "src.h3.load_h3_r8_to_psql:main"
merge-h3-timeseries = "src.h3.merge_h3_r8_timeseries:main"

# Radial domain
compute-radial = "src.radial.generate_radial_profiles:main"

# Tiles domain
generate-boundaries = "src.tiles.generate_boundaries:main"
generate-grid-outlines = "src.tiles.generate_grid_1km_outlines:main"
generate-h3-outlines = "src.tiles.generate_h3_r8_outlines:main"
generate-fonts = "src.tiles.generate_font_glyphs:main"
generate-sprites = "src.tiles.generate_hover_sprites:main"

# Web export domain
generate-city-index = "src.web_export.generate_city_index:main"
generate-city-populations = "src.web_export.generate_city_populations:main"
generate-radial-profiles-json = "src.web_export.generate_radial_profiles:main"
generate-city-cells = "src.web_export.generate_city_cells:main"

# Validate
validate = "src.validate.validate_cities:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "ipython>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

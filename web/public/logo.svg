<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 44" fill="none" stroke="currentColor" stroke-width="1.8">
  <!-- Back row (drawn first, partially hidden) -->
  <rect x="6" y="16" width="12" height="28" />
  <rect x="34" y="14" width="14" height="30" />

  <!-- Middle row -->
  <rect x="0" y="26" width="14" height="18" />
  <rect x="22" y="6" width="12" height="38" />
  <rect x="46" y="24" width="14" height="20" />

  <!-- Windows (small sharp squares) -->
  <g fill="currentColor" stroke="none">
    <!-- B-left (x=6) -->
    <rect x="9" y="22" width="2.5" height="2.5" />
    <rect x="9" y="30" width="2.5" height="2.5" />

    <!-- B-right (x=34) -->
    <rect x="38" y="20" width="2.5" height="2.5" />
    <rect x="38" y="28" width="2.5" height="2.5" />

    <!-- Front-left (x=0) -->
    <rect x="4" y="32" width="2.5" height="2.5" />
    <rect x="4" y="38" width="2.5" height="2.5" />

    <!-- Center tall (x=22) -->
    <rect x="26" y="12" width="2.5" height="2.5" />
    <rect x="26" y="20" width="2.5" height="2.5" />
    <rect x="26" y="28" width="2.5" height="2.5" />
    <rect x="26" y="36" width="2.5" height="2.5" />

    <!-- Front-right (x=46) -->
    <rect x="50" y="30" width="2.5" height="2.5" />
    <rect x="50" y="36" width="2.5" height="2.5" />
  </g>
</svg>
